<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resume — AI Resume Analyzer</title>
    <link rel="icon" type="image/png" href="/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: radial-gradient(ellipse at top left, #1e1b4b 0%, #0f172a 40%, #1e1b4b 100%);
            color: #cbd5e1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow-x: hidden;
        }

        /* Nav */
        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 1rem 2rem;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .nav-logo { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; }
        .nav-logo .icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #6366f1, #7c3aed);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
        }
        .nav-logo span { font-size: 1rem; font-weight: 700; color: #f1f5f9; }
        .nav-actions { display: flex; align-items: center; gap: 0.75rem; }
        .nav-user {
            font-size: 0.8rem; color: #94a3b8;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 0.4rem 0.85rem;
            border-radius: 8px;
        }
        .nav-user strong { color: #f1f5f9; }
        .btn-logout {
            font-size: 0.8rem; font-weight: 600;
            color: #fca5a5;
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.2);
            padding: 0.4rem 0.85rem;
            border-radius: 8px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-logout:hover { background: rgba(239,68,68,0.15); }

        /* Card container */
        .card {
            width: 100%;
            max-width: 600px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 24px;
            padding: 2.5rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
            margin-top: 5rem;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #f1f5f9;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }
        .header p {
            font-size: 0.95rem;
            color: #64748b;
        }

        /* Dropzone area */
        .dropzone-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 220px;
            border: 2px dashed rgba(99, 102, 241, 0.4);
            border-radius: 16px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.2s ease;
        }
        .dropzone-label:hover {
            background: rgba(99, 102, 241, 0.05);
            border-color: #6366f1;
        }
        .dropzone-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .dropzone-text {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 0.25rem;
        }
        .dropzone-subtext {
            font-size: 0.75rem;
            color: #64748b;
        }

        /* Button */
        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #6366f1, #7c3aed);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: opacity 0.2s, transform 0.15s;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
        }
        .btn-submit:hover { opacity: 0.92; transform: translateY(-1px); }
        .btn-submit:active { transform: translateY(0); }

        /* Error alert */
        .alert {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
        }

        .footer-note {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #475569;
        }
    </style>
</head>
<body>

    <!-- NAV -->
    <nav>
        <a href="/welcome" class="nav-logo">
            <div class="icon">🧠</div>
            <span>ResumeAI</span>
        </a>
        <div class="nav-actions">
            <span class="nav-user">Signed in as <strong>{{ display_name }}</strong></span>
            <a href="/logout" class="btn-logout">Log Out</a>
        </div>
    </nav>

    <div class="card">
        <div class="header">
            <h1>Analyze Your Resume</h1>
            <p>Upload your file to get an instant breakdown of your strengths and gaps.</p>
        </div>

        {% if error %}
        <div class="alert">⚠ {{ error }}</div>
        {% endif %}

        <form action="/analyze" method="post" enctype="multipart/form-data">
            <label for="dropzone-file" class="dropzone-label">
                <div class="dropzone-icon">📁</div>
                <p class="dropzone-text"><span class="font-semibold" style="color: #818cf8;">Click to upload</span> or drag and drop</p>
                <p class="dropzone-subtext">PDF, DOCX, or DOC (Max. 10MB)</p>
                <input id="dropzone-file" name="file" type="file" style="display: none;" accept=".pdf,.doc,.docx" required />
            </label>

            <button type="submit" class="btn-submit">Analyze Resume →</button>
        </form>
        
        <p class="footer-note">Secure & Private. Files are processed locally and deleted immediately after analysis.</p>
    </div>

    <script>
        const fileInput = document.getElementById('dropzone-file');
        fileInput.addEventListener('change', function(e) {
            if (this.files && this.files.length > 0) {
                const fileName = this.files[0].name;
                document.querySelector('.dropzone-text').innerHTML = `Selected file: <span style="color:#6ee7b7; font-weight:600;">${fileName}</span>`;
                document.querySelector('.dropzone-subtext').textContent = "Ready for upload";
            }
        });
    </script>
</body>
</html>
